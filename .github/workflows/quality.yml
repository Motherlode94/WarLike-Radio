name: WarLike application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax
        run: node --check app.js
      - name: Validate application DOM contracts
        run: node tests/smoke.mjs
