name: WarLike application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax
        run: node --check app.js
      - name: Validate application DOM contracts
        run: node tests/smoke.mjs
      - name: Install Chromium
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test interactive workflows in browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/warlike-test.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs
